name: Full Flutter CI

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Build environment"
        required: true
        type: environment
        default: "rdkn"
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      environment: ${{ inputs.target_env }}
      upload-artifact: false
